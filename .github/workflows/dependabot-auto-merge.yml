# Template: copied into each target repo by the Bootstrap Repos workflow.
# Merges dependency PRs after review via cursor-safe-to-merge label or Cursor GitHub App approval.
name: Dependency Auto Merge

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge approved dependency PR
    if: |
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        (
          github.event.review.user.login == 'cursor' ||
          github.event.review.user.login == 'cursor[bot]'
        )
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.label.name == 'cursor-safe-to-merge'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr.outputs.number }}"
          gh pr view "$PR" --repo "${{ github.repository }}" \
            --json labels,mergeable,mergeStateStatus,headRefName,baseRefName \
            > pr-meta.json
          cat pr-meta.json

          LABELS=$(jq -r '[.labels[].name] | join(",")' pr-meta.json)
          MERGEABLE=$(jq -r '.mergeable' pr-meta.json)
          MERGE_STATE=$(jq -r '.mergeStateStatus' pr-meta.json)
          BASE=$(jq -r '.baseRefName' pr-meta.json)

          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
          echo "mergeable=$MERGEABLE" >> "$GITHUB_OUTPUT"
          echo "merge_state=$MERGE_STATE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Verify dependency PR
        id: verify
        run: |
          LABELS="${{ steps.meta.outputs.labels }}"
          if ! echo "$LABELS" | grep -q 'dependencies'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: PR does not have the dependencies label"
            exit 0
          fi
          if echo "$LABELS" | grep -q 'cursor-blocked'; then
            echo "PR is blocked by Cursor review"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Verify mergeable
        if: steps.verify.outputs.skip != 'true'
        run: |
          if [ "${{ steps.meta.outputs.mergeable }}" != "MERGEABLE" ]; then
            echo "PR is not mergeable (state: ${{ steps.meta.outputs.merge_state }})"
            exit 1
          fi

      - name: Squash merge
        if: steps.verify.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" \
            --squash --delete-branch
          echo "Merged dependency PR #${{ steps.pr.outputs.number }}"
