name: App CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image metadata
        id: meta
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image_ref=${IMAGE_REPO}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_main=${IMAGE_REPO}:main" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "${{ steps.meta.outputs.image_ref }}" .
          docker push "${{ steps.meta.outputs.image_ref }}"
          docker tag "${{ steps.meta.outputs.image_ref }}" "${{ steps.meta.outputs.image_main }}"
          docker push "${{ steps.meta.outputs.image_main }}"

      - name: Dispatch pin update to homelab-ops
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.HOMELAB_OPS_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "MrAlexEatsYou",
              repo: "homelab-ops",
              event_type: "app_release_published",
              client_payload: {
                app_name: "homepage",
                source_repo: process.env.GITHUB_REPOSITORY,
                source_ref: process.env.GITHUB_REF_NAME,
                image: "${{ steps.meta.outputs.image_ref }}",
                healthcheck: "https://alexander.j.sealey-everest.nord/"
              }
            });
